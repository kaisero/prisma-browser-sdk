site_name: "prisma-browser-sdk"
site_description: "Python SDK for the Palo Alto Networks Prisma Browser"
repo_url: https://github.com/kaisero/prisma-browser-sdk
repo_name: kaisero/prisma-browser-sdk

theme:
  name: material
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Guides:
      - Authentication: guides/authentication.md
      - Pagination: guides/pagination.md
      - CRUD operations: guides/crud.md
  - API Reference: reference/

exclude_docs: |
  _hooks.py
  scripts/

hooks:
  - docs/_hooks.py

plugins:
  - search
  - gen-files:
      scripts: [docs/scripts/gen_ref_pages.py]
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
          options:
            docstring_style: sphinx
            extensions:
              - griffe_pydantic
            show_if_no_docstring: true
            filters:
              - "!^_"
              - "!_with_http_info$"
              - "!_without_preload_content$"
              - "!_serialize$"
              - "!^to_str$"
              - "!^to_json$"
              - "!^to_dict$"
              - "!^from_json$"
              - "!^from_dict$"
              - "!^model_config$"
              - "!^additional_properties$"
              - "!^actual_instance$"
              - "!^one_of_schemas$"
              - "!^oneof_schema_"
              - "!^anyof_schema_"
              - "!^any_of_schemas$"
              - "!^actual_instance_must_validate"
              - "!^discriminator_value_class_map$"
            show_bases: false
            show_source: false
            show_root_heading: true
            show_docstring_parameters: false
            members_order: source
            # Render the typed signature as a separate, cross-linked code block
            # so each param's model type links to its own reference page.
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

